[pytest]
# Permite ejecutar `pytest` desde la raíz sin exportar PYTHONPATH a mano:
# `shared` contiene módulos comunes (p. ej. arsoft_http) que importan Agents y Backend.
# Frontend y la raíz se añaden también para que los tests de Frontend resuelvan sus módulos.
pythonpath = Frontend . shared
testpaths = Test
markers =
    agente2: pruebas del Agente 2 (Test/test_Models), sin modelos ni Backend reales
    contrato: contrato CTR-004 con el Agente 1 real y calibración A2-08
    modelo_real: necesitan los pesos reales (RUN_REAL_RERANKER_TEST=1); se saltan por defecto
